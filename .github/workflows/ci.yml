name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate version metadata
        run: |
          test -s VERSION
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$' VERSION

      - name: Build
        run: mvn -B compile

