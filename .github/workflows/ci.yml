name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate version metadata
        run: |
          test -s VERSION
          tr -d '\r' < VERSION | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$'

      - name: Build
        run: mvn -B compile
